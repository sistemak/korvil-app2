<html lang="pt-BR"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MESTRE - Limpar Repositorio</title>
<style>*{box-sizing:border-box;font-family:Arial}body{background:#0b0714;color:#fff;padding:20px;max-width:600px;margin:auto}
h1{color:#ff4444}input{width:100%;padding:16px;border-radius:12px;border:1px solid #444;background:#1a1030;color:#fff;margin:10px 0;font-size:16px}
button{width:100%;padding:18px;border:0;border-radius:14px;font-weight:900;font-size:18px;cursor:pointer;margin-top:10px}
.btn-testar{background:#a855f7;color:#fff}.btn-del{background:#ff2222;color:#fff}.btn-list{background:#2563eb;color:#fff}
#log{background:#000;border:1px solid #333;border-radius:12px;padding:14px;margin-top:16px;white-space:pre-wrap;font-size:13px;min-height:220px;max-height:420px;overflow:auto}
.ok{color:#22c55e}.err{color:#ff4444}.warn{color:#ffcc00}.card{background:#1a1030;border:1px solid #ff2222;border-radius:14px;padding:14px;margin:14px 0}</style></head>
<body><h1>⚠️ MESTRE - LIMPAR REPO</h1>
<div class="card"><b>Repositorio:</b><br>https://github.com/sistemak/korvil-app2<br><b>ATENCAO:</b> Vai apagar TODOS os arquivos do repo, incluindo KORVIL do Bolt e kai-app. Sem volta.<br>Baixe backup antes: GitHub > Code > Download ZIP</div>
<label><b>1. Cole seu REPO_TOKEN:</b></label><input id="token" type="password" placeholder="ghp_... cole aqui" autocomplete="off">
<div id="infoToken" style="font-size:12px;color:#b7a8d9"></div>
<button class="btn-testar" id="btnTestar" type="button">🔑 ATIVAR E TESTAR ACESSO</button>
<button class="btn-list" id="btnListar" type="button">📋 LISTAR TODOS OS ARQUIVOS ANTES DE APAGAR</button>
<label><b>2. Para confirmar, digite exatamente:</b> DELETAR TUDO</label>
<input id="confirmacao" type="text" placeholder="Digite DELETAR TUDO" autocomplete="off">
<button class="btn-del" id="btnDeletar" type="button">🗑️ EXCLUIR TODOS OS ARQUIVOS DO REPOSITORIO</button>
<div id="log">Aguardando token...</div>
<script>
(function(){
'use strict';
var OWNER='sistemak', REPO='korvil-app2', BRANCH='main';
function el(id){return document.getElementById(id);}
function log(m,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=m;el('log').appendChild(d);el('log').scrollTop=9999;}
function cleanToken(t){if(!t)return '';t=String(t).trim();t=t.replace(/[\r\n\t ]/g,'');if(t.charAt(0)==='"'||t.charAt(0)==="'")t=t.slice(1);if(t.slice(-1)==='"'||t.slice(-1)==="'")t=t.slice(0,-1);t=t.replace(/^Bearer\s+/i,'').replace(/^token\s+/i,'');return t;}
function getToken(){var t=cleanToken(el('token').value);if(!t){alert('Cole o REPO_TOKEN primeiro');throw new Error('sem token');}if(t.length<20){alert('Token curto demais ('+t.length+'). Cola o token completo ghp_...');throw new Error('token curto');}el('token').value=t;try{localStorage.setItem('MESTRE_TOKEN',t);}catch(e){}el('infoToken').textContent='Token: '+t.length+' caracteres • '+t.slice(0,4)+'...'+t.slice(-4);return t;}
function mostrarInfo(){var t=cleanToken(el('token').value);el('infoToken').textContent=t?('Token: '+t.length+' caracteres • '+t.slice(0,4)+'...'+t.slice(-4)):'';}
try{var s=localStorage.getItem('MESTRE_TOKEN');if(s)el('token').value=s;}catch(e){} mostrarInfo();
el('token').addEventListener('input',mostrarInfo); el('token').addEventListener('paste',function(){setTimeout(mostrarInfo,50);});
async function testar(){try{var t=getToken();el('log').innerHTML='';log('Testando acesso em https://github.com/sistemak/korvil-app2 ...','warn');var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});var texto=await r.text();var j={};try{j=JSON.parse(texto);}catch(e){}if(!r.ok){var msg=j.message||texto.slice(0,300);if(r.status===401)throw new Error('401 - Token invalido / expirado. Gera um novo Tokens (classic) com escopo repo. GitHub disse: '+msg);if(r.status===403)throw new Error('403 - Token sem permissao repo. GitHub disse: '+msg);if(r.status===404)throw new Error('404 - Repo nao achado ou token sem acesso. GitHub disse: '+msg);throw new Error('Erro '+r.status+' - '+msg);}log('✅ ACESSO ATIVADO! Repo: '+j.full_name,'ok');log('⚠️ ATENCAO: Ativar nao apaga nada. Para apagar, clique em LISTAR e depois digite DELETAR TUDO.','warn');}catch(e){log('❌ '+e.message,'err');}}
async function listarArquivos(){try{var t=getToken();el('log').innerHTML='';log('Listando todos os arquivos...','warn');var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/git/trees/'+BRANCH+'?recursive=1',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});var j=await r.json();if(!r.ok)throw new Error('Erro '+r.status+' '+(j.message||''));var files=(j.tree||[]).filter(function(x){return x.type==='blob';});log('📋 Total de arquivos no repo: '+files.length,'warn');files.slice(0,200).forEach(function(f){log(' - '+f.path);});if(files.length>200)log('... e mais '+(files.length-200)+' arquivos');log('⚠️ Se clicar em EXCLUIR, TODOS esses '+files.length+' arquivos serao apagados, incluindo KORVIL do Bolt.','err');window._arquivosParaApagar=files;return files;}catch(e){log('❌ '+e.message,'err');return [];}}
async function deletarTudo(){try{var conf=el('confirmacao').value.trim();if(conf!=='DELETAR TUDO'){alert('Para confirmar, digite exatamente: DELETAR TUDO');return;}if(!confirm('TEM CERTEZA ABSOLUTA? Isso vai apagar TODOS os arquivos de sistemak/korvil-app2, incluindo o projeto KORVIL do Bolt. Sem volta!'))return;if(!confirm('ULTIMA CONFIRMACAO: Apagar tudo mesmo?'))return;var t=getToken();el('log').innerHTML='';log('🗑️ Começando exclusao total...','err');var files=window._arquivosParaApagar||await listarArquivos();if(!files.length){log('Nenhum arquivo para apagar ou lista vazia. Clique em LISTAR primeiro.','warn');return;}log('Vai apagar '+files.length+' arquivos, um por um...','warn');var ok=0,erro=0;for(var i=0;i<files.length;i++){var f=files[i];try{var res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+f.path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'MESTRE: excluir '+f.path,sha:f.sha,branch:BRANCH})});if(res.ok){ok++;log('✅ Apagado ('+ok+'/'+files.length+'): '+f.path,'ok');}else{erro++;var txt=await res.text();log('❌ Falhou '+f.path+' -> '+res.status+' '+txt.slice(0,200),'err');}}catch(e){erro++;log('❌ Erro '+f.path+': '+e.message,'err');}await new Promise(function(r){setTimeout(r,120);});}log('🎉 FIM: Apagados '+ok+', falhas '+erro+' de '+files.length,'ok');log('Repo limpo. Agora voce pode usar o MESTRE normal para criar o K-AI App do zero.','ok');}catch(e){log('❌ '+e.message,'err');}}
el('btnTestar').addEventListener('click',testar);el('btnListar').addEventListener('click',listarArquivos);el('btnDeletar').addEventListener('click',deletarTudo);
log('MESTRE Limpar carregado - ATIVAR igual antes. Ativar NAO apaga nada sozinho.');
})();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
