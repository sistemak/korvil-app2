<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>s.o.k - sistema operacional korvil</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png">
<link rel="manifest" href="/app/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'inter',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#222;border-radius:4px}
.logo-korvil{width:180px;height:48px;object-fit:contain;display:block}
.ktp-neon{border:2px solid #00ff88!important;box-shadow:0 0 20px #00ff88;animation:ktpPulse 2s infinite}
@keyframes ktpPulse{0%,100%{box-shadow:0 0 15px #00ff88}50%{box-shadow:0 0 30px #00ff88}}
@keyframes kaiPulse{0%,100%{box-shadow:0 0 25px #00d4ff,0 0 50px rgba(0,212,255,.3)}50%{box-shadow:0 0 35px #00d4ff,0 0 70px rgba(0,212,255,.4)}}
#kaiBubble{animation:kaiPulse 2s ease-in-out infinite}
.drawer-link{transition:.2s}.drawer-link:hover{background:#111}
.card-hover{transition:.2s}.card-hover:hover{border-color:#333;transform:translateY(-2px)}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- header -->
<header id="header" style="position:fixed;top:0;left:0;right:0;height:64px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50">
  <button id="menuBtn" style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#888;background:none;border:none;cursor:pointer;font-size:22px" aria-label="menu">&#9776;</button>
  <img src="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png" class="logo-korvil" alt="korvil" style="width:180px;height:48px;object-fit:contain;display:block">
  <div style="width:36px;height:36px;border-radius:50%;background:#00d4ff;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="usuario">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>
  </div>
</header>

<!-- sidebar -->
<aside id="sidebar" style="position:fixed;left:0;top:64px;bottom:0;width:90px;background:#0a0a0a;border-right:1px solid #1a1a1a;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:18px;z-index:40;overflow-y:auto">
  <div id="version-box" style="margin-top:auto;margin-bottom:12px;text-align:center;width:100%">
    <div id="ver" style="font-size:10px;color:#aaa;font-weight:bold">v-2026</div>
    <div id="date" style="font-size:10px;color:#666"></div>
  </div>
</aside>

<!-- drawer menu -->
<div id="drawer" style="position:fixed;top:0;left:-300px;width:280px;height:100vh;background:#0a0a0a;border-right:1px solid #222;z-index:60;transition:left .3s;overflow-y:auto;padding-top:64px">
  <div style="padding:16px;border-bottom:1px solid #222">
    <img src="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png" style="width:140px;height:38px;object-fit:contain;display:block" alt="korvil">
  </div>
  <div id="drawer-links" style="padding:8px 0"></div>
</div>
<div id="drawerOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;display:none"></div>

<!-- main -->
<main id="main" style="margin-left:90px;margin-top:64px;min-height:calc(100vh - 64px);background:#000;padding:24px;overflow-y:auto;height:calc(100vh - 64px)">
  <div id="content"></div>
</main>

<!-- k-ai bubble -->
<div id="kaiBubble" style="position:fixed;bottom:24px;right:24px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#00d4ff 0%,#0891b2 70%);display:flex;align-items:center;justify-content:center;cursor:grab;z-index:55;touch-action:none">
  <span style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:#00d4ff;font-size:11px;font-weight:bold;white-space:nowrap;text-shadow:0 0 4px rgba(0,212,255,.8)">k-ai</span>
  <img src="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sok/k-ai/assets/logokai/logokai.png" style="width:92px;height:92px;object-fit:contain;border-radius:50%;display:block;padding:8px" alt="k-ai">
</div>

<!-- k-ai modal -->
<div id="kaiModal" style="position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:70;display:none;align-items:center;justify-content:center">
  <div style="width:90%;max-width:420px;height:80vh;max-height:600px;background:#0a0a0a;border:1px solid #00d4ff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#111;border-bottom:1px solid #222">
      <div style="display:flex;align-items:center;gap:8px">
        <img src="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sok/k-ai/assets/logokai/logokai.png" style="width:32px;height:32px;object-fit:contain;border-radius:50%" alt="k-ai">
        <span style="font-weight:bold;font-size:14px">k-ai</span>
        <span style="font-size:10px;color:#00d4ff">online</span>
      </div>
      <button id="kaiClose" style="color:#888;background:none;border:none;font-size:20px;cursor:pointer">&times;</button>
    </div>
    <iframe id="kaiFrame" style="flex:1;border:none;width:100%"></iframe>
  </div>
</div>

<script>
const baseRaw = 'https://raw.githubusercontent.com/sistemak/korvil-app/main/';
const baseGh = 'https://github.com/sistemak/korvil-app/blob/main/';

const sections = [
  { id:'kalma', name:'k-alma', logo:baseRaw+'korvil/sections/kalma/images/logokalma.png', path:'korvil/sections/kalma/index.html', color:'#ec4899', tagline:'saude & bem-estar' },
  { id:'kafortunado', name:'k-afortunado', logo:baseRaw+'korvil/sections/kafortunado/images/logokafortunado.png', path:'korvil/sections/kafortunado/index.html', color:'#f59e0b', tagline:'empreendedorismo & financas' },
  { id:'ktp', name:'k-tp', logo:baseRaw+'korvil/sections/ktp/assets/images/logoktp.png', path:'korvil/sections/ktp/index.html', color:'#00ff88', tagline:'fitness & performance', neon:true },
  { id:'sistemak', name:'sistema k', logo:baseRaw+'korvil/sections/sistemak/images/logosistemak.png', path:'korvil/sections/sistemak/index.html', color:'#3b82f6', tagline:'servicos & tecnologia' }
];

const central = {
  desenvolvimentohumano: [
    { name:'cursos', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/index.html', icon:'&#128218;' },
    { name:'plataforma-dos-cursos', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/plataforma-dos-cursos.html', icon:'&#127891;' },
    { name:'areas', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/index.html', icon:'&#127979;' },
    { name:'treinamento-personalizado', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/treinamento-personalizado/index.html', icon:'&#127919;' },
    { name:'servicos-profissionais', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/servicos-profissionais/index.html', icon:'&#128188;' },
    { name:'form-pro-manut-cel', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/servicos-profissionais/form-pro-manut-cel/index.html', icon:'&#128241;' },
    { name:'saude / kth', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/index.html', icon:'&#128153;' },
    { name:'calendario-anual', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/calendario-anual.html', icon:'&#128197;' },
    { name:'conclusao-certificados', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/conclusao-certificados/index.html', icon:'&#127942;' },
    { name:'fase1', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/fase1/index.html', icon:'&#9312;' },
    { name:'fase2', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/fase2/index.html', icon:'&#9313;' },
    { name:'fase3', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/fase3/index.html', icon:'&#9314;' },
    { name:'fase4', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/saude/kth/fase4/index.html', icon:'&#9315;' },
    { name:'empreendedorismo / negocio-proprio', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/empreendedorismo/negocio-proprio/index.html', icon:'&#128640;' },
    { name:'beleza / cabeleireiro-unissex', path:'korvil/sections/centralkorvil/desenvolvimento-humano/cursos/areas/beleza/cabeleireiro-unissex/index.html', icon:'&#128135;' }
  ],
  negocios: [
    { name:'negocios', path:'korvil/sections/centralkorvil/negocios/index.html', icon:'&#128188;' },
    { name:'parcerias', path:'korvil/sections/centralkorvil/negocios/parcerias/index.html', icon:'&#129309;' }
  ],
  servicos: [
    { name:'servicos', path:'korvil/sections/centralkorvil/servicos/index.html', icon:'&#128295;' }
  ],
  korvilloja: [
    { name:'korvil-loja', path:'korvil/sections/centralkorvil/korvil-loja/index.html', icon:'&#128722;' },
    { name:'loja - sections/korvil-loja', path:'korvil/sections/korvil-loja/index.html', icon:'&#128722;' }
  ]
};

const sistemakItems = [
  { name:'servicos-gerais', path:'korvil/sections/sistemak/index.html', icon:'&#128295;' },
  { name:'suporte', path:'korvil/sections/sistemak/servicos/suporte.html', icon:'&#128737;' },
  { name:'integracoes', path:'korvil/sections/sistemak/servicos/integracoes.html', icon:'&#128268;' },
  { name:'sistemak', path:'korvil/sections/sistemak/index.html', icon:'&#9881;' }
];

const ktpItems = [
  { name:'k-tp', path:'korvil/sections/ktp/index.html', icon:'&#128170;' },
  { name:'projeto-transformacao', path:'korvil/sections/ktp/projetotransformacao/index.html', icon:'&#127939;' },
  { name:'planos', path:'korvil/sections/ktp/servicos/planos.html', icon:'&#128203;' }
];

const kafortunadoItems = [
  { name:'k-afortunado', path:'korvil/sections/kafortunado/index.html', icon:'&#128176;' },
  { name:'cursos', path:'korvil/sections/kafortunado/cursos.html', icon:'&#127891;' },
  { name:'oportunidades', path:'korvil/sections/kafortunado/oportunidades.html', icon:'&#128161;' }
];

const kalmaItems = [
  { name:'k-alma', path:'korvil/sections/kalma/index.html', icon:'&#128153;' },
  { name:'servicos', path:'korvil/sections/kalma/servicos.html', icon:'&#128295;' },
  { name:'terapeutas', path:'korvil/sections/kalma/terapeutas.html', icon:'&#129517;' }
];

// build sidebar icons
const sidebar = document.getElementById('sidebar');
const versionBox = document.getElementById('version-box');
sections.forEach(s => {
  const btn = document.createElement('button');
  btn.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:none;border:none';
  btn.onclick = () => loadSection(s.id);
  const imgDiv = document.createElement('div');
  imgDiv.style.cssText = 'width:64px;height:64px;border-radius:50%;background:#111;display:flex;align-items:center;justify-content:center;border:1px solid #222;' + (s.neon ? 'border:2px solid #00ff88;box-shadow:0 0 20px #00ff88;animation:ktpPulse 2s infinite;' : '');
  const img = document.createElement('img');
  img.src = s.logo;
  img.alt = s.name;
  img.style.cssText = 'width:56px;height:56px;object-fit:contain;border-radius:50%';
  img.onerror = () => { img.style.display = 'none'; imgDiv.style.background = s.color; };
  imgDiv.appendChild(img);
  const label = document.createElement('span');
  label.textContent = s.name;
  label.style.cssText = 'font-size:9px;color:#aaa;text-align:center';
  btn.appendChild(imgDiv);
  btn.appendChild(label);
  sidebar.insertBefore(btn, versionBox);
});

// version + date
const d = new Date();
document.getElementById('date').textContent = d.getDate() + '/' + (d.getMonth()+1) + ' ' + d.toLocaleDateString('pt-BR', { weekday:'short' });


// drawer
const drawer = document.getElementById('drawer');
const drawerOverlay = document.getElementById('drawerOverlay');
const drawerLinks = document.getElementById('drawer-links');

function buildDrawer() {
  let html = '';
  const groups = [
    { title: 'central korvil', items: [
      ...central.desenvolvimentohumano.map(i => ({...i, group: '1. desenvolvimento humano'})),
      ...central.negocios.map(i => ({...i, group: '2. negocios'})),
      ...central.servicos.map(i => ({...i, group: '3. servicos'})),
      ...central.korvilloja.map(i => ({...i, group: '4. k.l korvil-loja'}))
    ]},
    { title: 'sistema k', items: sistemakItems },
    { title: 'k-tp', items: ktpItems },
    { title: 'k-afortunado', items: kafortunadoItems },
    { title: 'k-alma', items: kalmaItems }
  ];
  groups.forEach(g => {
    html += '<div style="padding:8px 16px;font-size:10px;color:#555;text-transform:uppercase;font-weight:bold;letter-spacing:1px">' + g.title + '</div>';
    g.items.forEach(item => {
      html += '<a class="drawer-link" href="' + baseGh + item.path + '" target="_blank" style="display:block;padding:10px 16px;color:#ccc;font-size:13px;text-decoration:none">' + item.icon + ' ' + item.name + '</a>';
    });
  });
  drawerLinks.innerHTML = html;
}
buildDrawer();

document.getElementById('menuBtn').onclick = () => {
  drawer.style.left = '0';
  drawerOverlay.style.display = 'block';
};
drawerOverlay.onclick = () => {
  drawer.style.left = '-300px';
  drawerOverlay.style.display = 'none';
};

// content rendering
const content = document.getElementById('content');

function card(name, path, icon, color) {
  const url = baseGh + path;
  return '<a href="' + url + '" target="_blank" class="card-hover" style="display:flex;align-items:center;gap:12px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;padding:14px;text-decoration:none;color:#fff;min-width:0">' +
    '<span style="font-size:24px;flex-shrink:0">' + (icon || '&#128193;') + '</span>' +
    '<div style="flex:1;min-width:0">' +
      '<div style="font-size:14px;font-weight:600">' + name + '</div>' +
      '<div style="font-size:10px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + path + '</div>' +
    '</div>' +
    '<span style="color:' + (color || '#333') + ';font-size:18px;flex-shrink:0">&rsaquo;</span>' +
  '</a>';
}

function sectionHeader(name, tagline, logo, color) {
  return '<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">' +
    '<img src="' + logo + '" style="width:64px;height:64px;object-fit:contain;border-radius:50%;border:2px solid ' + (color || '#333') + '" onerror="this.style.display=\'none\'">' +
    '<div><h2 style="font-size:24px;font-weight:800">' + name + '</h2><p style="color:#666;font-size:13px">' + tagline + '</p></div>' +
  '</div>';
}

function grid(items, color) {
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:900px">' +
    items.map(i => card(i.name, i.path, i.icon, color)).join('') + '</div>';
}

function renderCentral() {
  content.innerHTML = '<div class="fade-in">' +
    '<div style="margin-bottom:24px">' +
      '<h1 style="font-size:28px;font-weight:800">central korvil</h1>' +
      '<p style="color:#666;font-size:14px;margin-top:4px">sistema operacional korvil - acesso total automatico: github + bolt + app</p>' +
    '</div>' +
    '<h3 style="font-size:16px;font-weight:bold;color:#a855f7;margin-bottom:12px">1. desenvolvimento humano</h3>' +
    grid(central.desenvolvimentohumano, '#a855f7') +
    '<h3 style="font-size:16px;font-weight:bold;color:#f59e0b;margin:24px 0 12px">2. negocios</h3>' +
    grid(central.negocios, '#f59e0b') +
    '<h3 style="font-size:16px;font-weight:bold;color:#3b82f6;margin:24px 0 12px">3. servicos</h3>' +
    grid(central.servicos, '#3b82f6') +
    '<h3 style="font-size:16px;font-weight:bold;color:#22c55e;margin:24px 0 12px">4. k.l korvil-loja</h3>' +
    grid(central.korvilloja, '#22c55e') +
  '</div>';
}

function loadSection(id) {
  const s = sections.find(x => x.id === id);
  if (!s) return;
  let items = [];
  if (id === 'kalma') items = kalmaItems;
  else if (id === 'kafortunado') items = kafortunadoItems;
  else if (id === 'ktp') items = ktpItems;
  else if (id === 'sistemak') items = sistemakItems;
  content.innerHTML = '<div class="fade-in">' +
    '<button onclick="renderCentral()" style="color:#666;background:none;border:none;cursor:pointer;font-size:13px;margin-bottom:16px">&larr; central</button>' +
    sectionHeader(s.name, s.tagline, s.logo, s.color) +
    grid(items, s.color) +
  '</div>';
}

// initial load
renderCentral();

// k-ai bubble drag + click
const kaiBubble = document.getElementById('kaiBubble');
const kaiModal = document.getElementById('kaiModal');
const kaiFrame = document.getElementById('kaiFrame');
const kaiClose = document.getElementById('kaiClose');

kaiClose.onclick = () => { kaiModal.style.display = 'none'; kaiFrame.src = ''; };

let isDragging = false, startX, startY, offsetX, offsetY, pressTime, hasMoved;

function startDrag(x, y) {
  const rect = kaiBubble.getBoundingClientRect();
  offsetX = x - rect.left;
  offsetY = y - rect.top;
  startX = x; startY = y;
  pressTime = Date.now();
  hasMoved = false;
  isDragging = false;
}

function moveDrag(x, y) {
  const dx = Math.abs(x - startX), dy = Math.abs(y - startY);
  if (dx > 5 || dy > 5) hasMoved = true;
  if (hasMoved) {
    isDragging = true;
    kaiBubble.style.animation = 'none';
    let nx = x - offsetX;
    let ny = y - offsetY;
    nx = Math.max(16, Math.min(window.innerWidth - 92 - 16, nx));
    ny = Math.max(80, Math.min(window.innerHeight - 92 - 16, ny));
    kaiBubble.style.left = nx + 'px';
    kaiBubble.style.top = ny + 'px';
    kaiBubble.style.right = 'auto';
    kaiBubble.style.bottom = 'auto';
  }
}

function endDrag() {
  const elapsed = Date.now() - pressTime;
  if (!hasMoved && elapsed < 2000) {
    kaiFrame.src = baseRaw + 'korvil/sok/k-ai/index.html';
    kaiModal.style.display = 'flex';
  }
  if (isDragging) {
    const rect = kaiBubble.getBoundingClientRect();
    const cx = rect.left + 46;
    const cy = rect.top + 46;
    let snapX;
    if (cx < window.innerWidth / 2) snapX = 24;
    else snapX = window.innerWidth - 92 - 24;
    const snapY = Math.max(80, Math.min(window.innerHeight - 92 - 24, cy));
    kaiBubble.style.left = snapX + 'px';
    kaiBubble.style.top = snapY + 'px';
    kaiBubble.style.animation = 'kaiPulse 2s ease-in-out infinite';
  }
  isDragging = false;
}

kaiBubble.addEventListener('mousedown', e => { startDrag(e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { if (pressTime) moveDrag(e.clientX, e.clientY); });
document.addEventListener('mouseup', () => { if (pressTime) { endDrag(); pressTime = null; } });

kaiBubble.addEventListener('touchstart', e => { const t = e.touches[0]; startDrag(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (pressTime) { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); } }, { passive: true });
document.addEventListener('touchend', () => { if (pressTime) { endDrag(); pressTime = null; } });

window.renderCentral = renderCentral;
window.loadSection = loadSection;

</script>

<button id="installBtn" style="display:none;position:fixed;bottom:20px;right:20px;z-index:99999;background:#00d4ff;color:#000;padding:14px 22px;border:none;border-radius:12px;font-weight:bold;box-shadow:0 4px 15px rgba(0,212,255,0.5)">INSTALAR APP</button>
<script>
let deferredPrompt=null;
const btn=document.getElementById('installBtn');
if('serviceWorker' in navigator){navigator.serviceWorker.register('/app/service-worker.js',{scope:'/app/'}).then(()=>console.log('SW ok'));}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.style.display='block';});
btn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const c=await deferredPrompt.userChoice;console.log(c.outcome);deferredPrompt=null;btn.style.display='none';});
window.addEventListener('appinstalled',()=>{btn.style.display='none';console.log('App instalado');});
</script>
</body>
</html>
