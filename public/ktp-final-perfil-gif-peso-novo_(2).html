        :root{--c:#22d3ee;--c-soft:rgba(34,211,238,.12);--c-line:rgba(34,211,238,.3);--c-ink:#04131a;--bg:#07080a;--surface:#0e1115;--surface-2:#151920;--borda:#232832;--text:#f4f4f5;--text-2:#a1a1aa;--text-3:#71717a;--ok:#34d399;--erro:#f87171;--aviso:#fbbf24;--azul:#3b82f6;--sombra:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);}

        *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;max-width:100%;}
        html,body{max-width:100vw;overflow-x:hidden;}
        body{background:var(--bg);color:var(--text);margin:0;overflow-x:hidden;max-width:100vw;line-height:1.5;-webkit-font-smoothing:antialiased;}
        button,input,textarea,select{font:inherit;}

        @keyframes surgir{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
        @keyframes deslizar{from{transform:translateX(-100%)}to{transform:none}}
        @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

        .header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;padding:12px 16px 12px 64px;background:rgba(7,8,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--borda);}
        h1{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text);line-height:1.2;}

        .menu-btn{position:fixed;top:12px;left:16px;z-index:101;width:40px;height:40px;display:grid;place-items:center;background:var(--surface-2);color:var(--c);border:1px solid var(--c-line);border-radius:10px;font-size:18px;cursor:pointer;transition:background .2s,transform .2s;}
        .menu-btn:hover{background:var(--c-soft);transform:translateY(-1px);}

        #menu-lateral{position:fixed;left:0;top:0;width:280px;height:100%;background:var(--surface);border-right:1px solid var(--borda);z-index:200;overflow-y:auto;padding:76px 0 24px;display:none;box-shadow:var(--sombra);animation:deslizar .25s ease;}
        #menu-lateral.ativo{display:block;}
        #overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:199;display:none;}
        #overlay.ativo{display:block;}
        .menu-titulo{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--text);border-bottom:1px solid var(--borda);cursor:pointer;transition:background .2s;}
        .menu-titulo:hover{background:var(--surface-2);}
        .menu-titulo::after{content:'+';font-size:16px;color:var(--c);}
        .menu-titulo.aberto::after{content:'−';}
        .semanas-da-fase{background:var(--bg);display:none;}
        .semanas-da-fase.aberta{display:block;}
        .semana-item{display:block;padding:10px 20px 10px 28px;font-size:12px;color:var(--text-2);border-bottom:1px solid var(--borda);cursor:pointer;line-height:1.4;transition:background .15s,color .15s;}
        .semana-item:hover{background:var(--surface-2);color:var(--text);}
        .semana-item.atual{color:var(--text);background:var(--c-soft);box-shadow:inset 3px 0 0 var(--c);font-weight:600;}

        .container{width:100%;max-width:960px;margin:0 auto;padding:24px 16px 56px;overflow-x:hidden;box-sizing:border-box;}
        .logo-card{display:flex;justify-content:center;margin:8px 0 24px;}
        .logo-card img{max-height:112px;width:auto;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(34,211,238,.18));}

        .semana-org{background:var(--surface);border:1px solid var(--borda);border-radius:16px;padding:24px;box-shadow:var(--sombra);animation:surgir .4s ease both;}
