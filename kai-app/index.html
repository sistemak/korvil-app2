<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-AI App</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0714">
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="telaHome" class="home">
  <header class="top"><div class="logo">K-AI<span>.app</span></div><div class="topLinks"><span>Soluções</span><span>Recursos</span><span>Preço</span></div><div><button class="btnGhost" onclick="irParaApp()">Entrar</button><button class="btnBlue" onclick="irParaApp()">Começar</button></div></header>
  <main class="hero">
    <h1>O que você vai construir hoje?</h1>
    <p class="heroSub">Crie apps e sites incríveis conversando com IA.</p>
    <div class="promptBox">
      <textarea id="promptHome" placeholder="Vamos construir um painel admin..."></textarea>
      <div class="promptRow"><button class="btnPlus" onclick="document.getElementById('promptHome').focus()">+</button><span class="plan">💡 Planejar</span><button class="btnBuild" onclick="criarDoHome()">Build now ➤</button></div>
    </div>
    <div class="exemplos">
      <button onclick="usarExemplo('cria um app de vendas com botão verde e carrinho')">🛒 App de vendas</button>
      <button onclick="usarExemplo('cria um site de pizzaria com cardápio e botão de pedido')">🍕 Pizzaria</button>
      <button onclick="usarExemplo('cria um app de tarefas com lista, concluir e excluir')">✅ Tarefas</button>
      <button onclick="usarExemplo('cria um dashboard de vendas com gráfico e total')">📊 Dashboard</button>
    </div>
  </main>
  <h3 style="padding:0 20px">Meus Projetos</h3><div id="listaHome" style="padding:0 20px 40px"></div>
</div>

<div id="telaApp" class="app" style="display:none">
  <aside class="sidebar">
    <div class="logo">K-AI<span>.app</span></div>
    <button class="btnNew" onclick="novoProjetoPrompt()">+ Novo Projeto</button>
    <input id="buscaProjeto" placeholder="Buscar projeto..." oninput="renderProjetos()">
    <div id="listaProjetos"></div>
    <div class="sideFoot"><button onclick="voltarHome()">🏠 Início</button><button onclick="publicarTudo()">🚀 Publicar tudo</button></div>
  </aside>
  <section class="main">
    <div class="tabs"><button id="tabPrev" class="tab active" onclick="mostrarAba('preview')">Preview</button><button id="tabCode" class="tab" onclick="mostrarAba('codigo')">Código</button><span id="status" class="status">Pronto</span><button class="btnPub" onclick="publicarAtual()">Publicar</button></div>
    <div class="work">
      <div class="chatPanel">
        <div class="chatHead"><b id="chatTitulo">Novo Projeto</b><span id="chatProjetoNome"></span></div>
        <div id="msgs"></div>
        <div class="chatInput"><textarea id="prompt" placeholder="Descreva, peça pra criar, editar, corrigir, adicionar, refazer, melhorar... Ex: muda o botão pra verde"></textarea>
        <div class="chatActions"><span id="acaoDetectada">Ação: criar</span><button onclick="enviarParaKAI()">Enviar ➤</button></div></div>
        <div class="quick"><button onclick="rapido('corrige o erro e melhora o visual')">Corrigir erro</button><button onclick="rapido('melhora o visual, deixa mais bonito e moderno')">Melhorar visual</button><button onclick="rapido('adiciona um botão novo e uma seção nova')">Adicionar</button><button onclick="rapido('refaz tudo do zero, mais completo')">Refazer</button></div>
      </div>
      <div class="previewPanel">
        <div id="painelPreview"><iframe id="previewFrame"></iframe><div id="previewVazio" class="vazio">Nenhum projeto aberto. Crie um projeto e peça pra IA construir.</div></div>
        <div id="painelCodigo" style="display:none"><div class="fileBar"><div id="listaArquivos"></div><button onclick="copiarCodigo()">Copiar</button><button onclick="baixarProjeto()">Baixar .zip / .html</button></div><pre id="codigoAtual"></pre></div>
      </div>
    </div>
  </section>
</div>
<script src="config.js"></scr'+'ipt><script src="k-ai.js"></scr'+'ipt><script src="app.js"></scr'+'ipt>
</body></html>
