"function excluirProjeto(i){if(!confirm('Excluir '+projetos[i].nome+'?'))return;projetos.splice(i,1);salvar();renderProjetos();renderHome();if(projetoAtual&&projetos.indexOf(projetoAtual)<0)projetoAtual=null;}",
"function abrirProjeto(i){projetoAtual=projetos[i];if(!projetoAtual)return;$('chatTitulo').innerText='Projeto: '+projetoAtual.nome;$('chatProjetoNome').innerText=' - '+projetoAtual.arquivos.length+' arquivos';$('msgs').innerHTML='';(projetoAtual.msgs||[]).forEach(function(m){addMsg(m.texto,m.me,true);});if(!projetoAtual.msgs||!projetoAtual.msgs.length)addMsg('Projeto '+projetoAtual.nome+' aberto. O que quer fazer? Criar, editar, corrigir, adicionar, refazer, melhorar?');renderProjetos();atualizarPreview();}",

"function detectarAcao(texto){var t=texto.toLowerCase();if(t.indexOf('corrige')>=0||t.indexOf('corrigir')>=0||t.indexOf('erro')>=0||t.indexOf('bug')>=0||t.indexOf('quebrou')>=0||t.indexOf('nao funciona')>=0)return 'corrigir';if(t.indexOf('refaz')>=0||t.indexOf('refazer')>=0||t.indexOf('recria')>=0||t.indexOf('do zero')>=0)return 'refazer';if(t.indexOf('melhora')>=0||t.indexOf('melhorar')>=0||t.indexOf('mais bonito')>=0)return 'melhorar';if(t.indexOf('edit')>=0||t.indexOf('muda')>=0||t.indexOf('mudar')>=0||t.indexOf('troca')>=0||t.indexOf('trocar')>=0||t.indexOf('deixa')>=0)return 'editar';if(t.indexOf('adicion')>=0||t.indexOf('inclu')>=0||t.indexOf('coloca')>=0||t.indexOf('cria um botao')>=0)return 'adicionar';if(t.indexOf('remove')>=0||t.indexOf('remover')>=0||t.indexOf('tira')>=0||t.indexOf('exclu')>=0)return 'remover';return 'criar';}",

"async function enviarTexto(texto,jaMostrou){var acao=detectarAcao(texto);$('acaoDetectada').innerText='A\u00e7\u00e3o: '+acao;if(!jaMostrou)addMsg(texto,true);addMsg('K-AI ('+acao+') construindo com Gemini + GROQ + Pollinations via Supabase...');$('status').innerText='Construindo...';try{var arquivos=await window.KAI.gerar(texto,projetoAtual.nome,projetoAtual.arquivos,acao);projetoAtual.arquivos=arquivos;projetoAtual.desc=texto;var idx=projetos.findIndex(function(p){return p.nome===projetoAtual.nome;});if(idx>=0)projetos[idx]=projetoAtual;else projetos.unshift(projetoAtual);salvar();renderProjetos();renderHome();atualizarPreview();listarArquivos();$('status').innerText='Pronto';addMsg('Pronto! ('+acao+') Arquivos: '+arquivos.map(function(f){return f.path;}).join(', ')+' - Veja no Preview, no C\u00f3digo, edite pedindo no chat, e clique em Publicar.');}catch(e){$('status').innerText='Erro';addMsg('Erro: '+e.message);}}",

"async function githubCommitDireto(path,content,message){var token=await garantirToken();if(!token)throw new Error('Sem REPO_TOKEN');var sha=null;var get=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(get.ok){var j=await get.json();sha=j.sha;}var res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:message,content:btoa(unescape(encodeURIComponent(content))),sha:sha||undefined,branch:'main'})});if(!res.ok)throw new Error('GitHub '+res.status);}",
