  if(get.ok){ var gj=await get.json(); sha=gj.sha; }
  var res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+encPath(path),{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'MESTRE K-AI: criar '+path, content:b64(conteudo), sha:sha||undefined, branch:BRANCH})});
  if(!res.ok) throw new Error(path+' -> '+res.status+' '+(await res.text()).slice(0,300));

    var readme='# K-AI App - Bolt-like com Supabase\n\nGemini + GROQ + Pollinations juntos via Supabase Edge Functions\n\n## Backend Supabase\n- POST /functions/v1/k-ai -> Gemini planeja + GROQ codifica + Pollinations imagem/texto\n- POST /functions/v1/publish -> commita no GitHub com GH_TOKEN / REPO_TOKEN\n\n## Secrets (Supabase Dashboard > Edge Functions > Secrets)\nGEMINI_API_KEY / GROQ_API_KEY / GH_TOKEN / REPO_TOKEN\n\n## Deploy das funcoes\nsupabase link --project-ref vbckzfvqarcjadqxmdqc\nsupabase functions deploy k-ai\nsupabase functions deploy publish\n\n## Tabelas\nVer supabase/migrations/criar_tabelas.sql\n';
    var sqlMig=[
'-- K-AI App - Tabelas Supabase',
'create table if not exists public.kai_projetos (id uuid default gen_random_uuid() primary key, nome text not null, descricao text, arquivos jsonb default \'[]\'::jsonb, created_at timestamptz default now());',
'create table if not exists public.kai_mensagens (id uuid default gen_random_uuid() primary key, projeto_id uuid references public.kai_projetos(id) on delete cascade, papel text, conteudo text, created_at timestamptz default now());',
'alter table public.kai_projetos enable row level security;',
'alter table public.kai_mensagens enable row level security;',
"create policy \"leitura publica projetos\" on public.kai_projetos for select using (true);",
"create policy \"escrita publica projetos\" on public.kai_projetos for insert with check (true);",
"create policy \"update publica projetos\" on public.kai_projetos for update using (true);",
"create policy \"leitura publica mensagens\" on public.kai_mensagens for select using (true);",
"create policy \"escrita publica mensagens\" on public.kai_mensagens for insert with check (true);"
    ].join('\n');
    var edgeKai=[
"// Supabase Edge Function k-ai - Deno - Secrets: GEMINI_API_KEY, GROQ_API_KEY",
"import { serve } from 'https://deno.land/std@0.168.0/http/server.ts';",
"serve(async (req) => {",
"  if (req.method === 'OPTIONS') return new Response('ok', { headers: { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type' } });",
'  try {',
"    const { prompt, nomeProjeto, arquivosAtuais, acao } = await req.json();",
"    if (!prompt) return new Response(JSON.stringify({ error: 'sem prompt' }), { status: 400, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"    const arquivosTxt = (arquivosAtuais || []).map((f) => 'ARQUIVO ' + f.path + ':\\n' + (f.content || '').slice(0, 4000)).join('\\n\\n');",
"    const sistema = 'Voce e o K-AI, um gerador de apps tipo Bolt. Responda SEMPRE com 3 blocos: ```html ... ``` depois ```css ... ``` depois ```js ... ```. HTML completo, bonito, responsivo, tema escuro roxo #0b0714 / #a855f7, botoes funcionais em JS puro. Se a acao for editar/corrigir/adicionar, devolva os arquivos COMPLETOS ja editados, nao so o trecho. Nao explique fora dos blocos.';",
"    const usuario = 'Acao: ' + (acao || 'criar') + ' | Projeto: ' + (nomeProjeto || 'meu-app') + ' | Pedido: ' + prompt + (arquivosTxt ? ' | Arquivos atuais:\\n' + arquivosTxt : '');",
'    let texto = "";',
"    const groqKey = Deno.env.get('GROQ_API_KEY');",
'    if (groqKey) {',
"      try { const r = await fetch('https://api.groq.com/openai/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + groqKey }, body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: [{ role: 'system', content: sistema }, { role: 'user', content: usuario }], temperature: 0.7, max_tokens: 6000 }) }); if (r.ok) { const j = await r.json(); texto = j.choices?.[0]?.message?.content || ''; } } catch (e) { console.log('GROQ falhou', e.message); }",
'    }',
"    const geminiKey = Deno.env.get('GEMINI_API_KEY');",
'    if (!texto && geminiKey) {',
"      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + geminiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: sistema + '\\n' + usuario }] }] }) }); if (!r.ok) throw new Error('Gemini ' + r.status); const j = await r.json(); texto = j.candidates?.[0]?.content?.parts?.map((p) => p.text).join('') || '';",
'    }',
'    // Pollinations texto sem chave - 3o fallback',
'    if (!texto) {',
"      try { const r = await fetch('https://text.pollinations.ai/' + encodeURIComponent(usuario.slice(0, 2000)), { headers: { 'Content-Type': 'application/json' } }); if (r.ok) texto = await r.text(); } catch (e) { console.log('Pollinations texto falhou', e.message); }",
'    }',
"    if (!texto) return new Response(JSON.stringify({ error: 'Nenhuma IA respondeu. Confira GEMINI_API_KEY / GROQ_API_KEY nos Secrets.' }), { status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"    return new Response(JSON.stringify({ texto }), { headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"  } catch (e) { return new Response(JSON.stringify({ error: e.message }), { status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } }); }",
'});'
    ].join('\n');
    var edgePublish=[
"// Supabase Edge Function publish - Deno - Secrets: GH_TOKEN / REPO_TOKEN",
"import { serve } from 'https://deno.land/std@0.168.0/http/server.ts';",
"serve(async (req) => {",
"  if (req.method === 'OPTIONS') return new Response('ok', { headers: { 'Access-Control-Allow-Origin': '*', 'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type' } });",
'  try {',
"    const token = Deno.env.get('GH_TOKEN') || Deno.env.get('REPO_TOKEN');",
"    if (!token) return new Response(JSON.stringify({ error: 'Sem GH_TOKEN / REPO_TOKEN no backend' }), { status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"    const { path, content, message } = await req.json();",
"    const base = 'https://api.github.com/repos/sistemak/korvil-app2/contents/' + path.split('/').map(encodeURIComponent).join('/');",
'    let sha = null; const get = await fetch(base, { headers: { Authorization: \'Bearer \' + token, Accept: \'application/vnd.github+json\' } }); if (get.ok) { const j = await get.json(); sha = j.sha; }',
"    const put = await fetch(base, { method: 'PUT', headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ message: message || ('K-AI: ' + path), content: btoa(unescape(encodeURIComponent(content))), sha: sha || undefined, branch: 'main' }) });",
"    if (!put.ok) return new Response(JSON.stringify({ error: await put.text() }), { status: put.status, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"    return new Response(JSON.stringify({ ok: true }), { headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } });",
"  } catch (e) { return new Response(JSON.stringify({ error: e.message }), { status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' } }); }",
'});'
    ].join('\n');
    var supaConfig='[functions.k-ai]\nverify_jwt = false\n\n[functions.publish]\nverify_jwt = false\n';
    var deployMd='# Deploy Supabase\n\n1. Instale CLI: npm i -g supabase\n2. supabase login\n3. supabase link --project-ref vbckzfvqarcjadqxmdqc\n4. supabase functions deploy k-ai\n5. supabase functions deploy publish\n6. Confira Secrets em Dashboard > Edge Functions > Secrets: GEMINI_API_KEY, GROQ_API_KEY, GH_TOKEN, REPO_TOKEN\n7. Rode SQL em supabase/migrations/criar_tabelas.sql no SQL Editor\n\nNUNCA coloque sb_secret no front ou no GitHub. No front vai SO sb_publishable.\n';
    await enviarArquivo('kai-app/index.html', indexHtml);
    await enviarArquivo('kai-app/style.css', styleCss);
    await enviarArquivo('kai-app/config.js', configJs);
    await enviarArquivo('kai-app/k-ai.js', kAiJs);
    await enviarArquivo('kai-app/app.js', appJs);
    await enviarArquivo('kai-app/manifest.json', manifestJson);
    await enviarArquivo('kai-app/README.md', readme);
    await enviarArquivo('kai-app/supabase/migrations/criar_tabelas.sql', sqlMig);
    await enviarArquivo('kai-app/supabase/functions/k-ai/index.ts', edgeKai);
    await enviarArquivo('kai-app/supabase/functions/publish/index.ts', edgePublish);
    await enviarArquivo('kai-app/supabase/config.toml', supaConfig);
    await enviarArquivo('kai-app/supabase/DEPLOY.md', deployMd);
    await enviarArquivo('kai-app/projetos/.gitkeep', 'Pasta mae dos projetos criados pelo K-AI App');
    log('🎉 TUDO CRIADO COM SUCESSO!','ok');
    log('Supabase: '+SUPA_URL,'ok');
    log('Proximo passo: deploy das Edge Functions - ver kai-app/supabase/DEPLOY.md','warn');
    log('Abra: https://github.com/sistemak/korvil-app2/tree/main/kai-app','ok');
  }catch(e){ log('❌ ERRO: '+e.message,'err'); }
}
el('btnTestar').addEventListener('click', testar);
el('btnCriar').addEventListener('click', criarTudo);
window.testar=testar;
window.criarTudo=criarTudo;
log('MESTRE carregado - ATIVAR igual antes + Supabase. Cole o token e clique em ATIVAR.');
})();
