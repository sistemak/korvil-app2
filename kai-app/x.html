<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESTRE - Criar K-AI App</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#0b0714;color:#fff;padding:20px;max-width:600px;margin:auto}
h1{color:#a855f7}input{width:100%;padding:16px;border-radius:12px;border:1px solid #444;background:#1a1030;color:#fff;margin:10px 0;font-size:16px}
button{width:100%;padding:18px;border:0;border-radius:14px;font-weight:900;font-size:18px;cursor:pointer;margin-top:10px}
.btn-criar{background:#22c55e;color:#000}.btn-testar{background:#a855f7;color:#fff}
#log{background:#000;border:1px solid #333;border-radius:12px;padding:14px;margin-top:16px;white-space:pre-wrap;font-size:13px;min-height:200px;max-height:400px;overflow:auto}
.ok{color:#22c55e}.err{color:#ff4444}.warn{color:#ffcc00}
.card{background:#1a1030;border:1px solid #2e1a5e;border-radius:14px;padding:14px;margin:14px 0}
</style>
</head>
<body>
<h1>⚡ MESTRE K-AI</h1>
<p>Cria tudo do K-AI App dentro do repositório. Não fica dentro do K-AI App.</p>
<div class="card">
<b>Repositório:</b><br>https://github.com/sistemak/korvil-app2<br>
<b>Pasta mãe:</b> kai-app/
</div>
<label><b>1. Cole seu REPO_TOKEN:</b></label>
<input id="token" type="password" placeholder="ghp_... cole aqui" autocomplete="off">
<div id="infoToken" style="font-size:12px;color:#b7a8d9"></div>
<button class="btn-testar" id="btnTestar" type="button">🔑 ATIVAR E TESTAR ACESSO</button>
<button class="btn-criar" id="btnCriar" type="button">🚀 CRIAR TUDO AGORA NA PASTA kai-app</button>
<div id="log">Aguardando token...</div>
<script>
(function(){
'use strict';
var OWNER='sistemak', REPO='korvil-app2', BRANCH='main';
function el(id){ return document.getElementById(id); }
function log(m,c){ var d=document.createElement('div'); if(c) d.className=c; d.textContent=m; el('log').appendChild(d); el('log').scrollTop=9999; }
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
function encPath(p){ return p.split('/').map(function(x){return encodeURIComponent(x);}).join('/'); }
function cleanToken(t){ if(!t) return ''; t=String(t).trim(); t=t.replace(/[\r\n\t ]/g,''); if(t.charAt(0)==='"' || t.charAt(0)==="'") t=t.slice(1); if(t.slice(-1)==='"' || t.slice(-1)==="'") t=t.slice(0,-1); t=t.replace(/^Bearer\s+/i,'').replace(/^token\s+/i,''); return t; }
function getToken(){
  var t=cleanToken(el('token').value);
  if(!t){ alert('Cole o REPO_TOKEN primeiro'); throw new Error('sem token'); }
  if(t.length<20){ alert('Token curto demais ('+t.length+'). Cola o token completo ghp_...'); throw new Error('token curto'); }
  el('token').value=t;
  try{ localStorage.setItem('MESTRE_TOKEN',t); }catch(e){}
  el('infoToken').textContent='Token: '+t.length+' caracteres • '+t.slice(0,4)+'...'+t.slice(-4);
  return t;
}
function mostrarInfo(){ var t=cleanToken(el('token').value); el('infoToken').textContent=t ? ('Token: '+t.length+' caracteres • '+t.slice(0,4)+'...'+t.slice(-4)) : ''; }
try{ var s=localStorage.getItem('MESTRE_TOKEN'); if(s) el('token').value=s; }catch(e){}
mostrarInfo();
el('token').addEventListener('input', mostrarInfo);
el('token').addEventListener('paste', function(){ setTimeout(mostrarInfo,50); });
async function testar(){
  try{
    var t=getToken();
    el('log').innerHTML='';
    log('Testando acesso em https://github.com/sistemak/korvil-app2 ...','warn');
    var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
    if(r.status===401||r.status===403){
      log('Bearer deu '+r.status+', tentando formato token...','warn');
      r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'token '+t,Accept:'application/vnd.github+json'}});
    }
    var texto=await r.text(); var j={}; try{ j=JSON.parse(texto); }catch(e){}
    if(!r.ok){
      var msg=j.message||texto.slice(0,300);
      if(r.status===401) throw new Error('401 - Token invalido / expirado. Gera um novo Tokens (classic) com escopo repo. GitHub disse: '+msg);
      if(r.status===403) throw new Error('403 - Token sem permissao repo. GitHub disse: '+msg);
      if(r.status===404) throw new Error('404 - Repo nao achado ou token sem acesso. GitHub disse: '+msg);
      throw new Error('Erro '+r.status+' - '+msg);
    }
    log('✅ ACESSO ATIVADO! Repo: '+j.full_name,'ok');
    log('✅ Pronto pra criar. Clique em CRIAR TUDO AGORA','ok');
  }catch(e){
    if(String(e.message).indexOf('Failed to fetch')>=0){ log('❌ Sem conexao com api.github.com. Verifique a internet.','err'); }
    else { log('❌ '+e.message,'err'); }
  }
}
async function enviarArquivo(path, conteudo){
  var token=getToken(); var sha=null;
  var get=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+encPath(path),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
  if(get.ok){ var gj=await get.json(); sha=gj.sha; }
  var res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+encPath(path),{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'MESTRE K-AI: criar '+path, content:b64(conteudo), sha:sha||undefined, branch:BRANCH})});
  if(!res.ok) throw new Error(path+' -> '+res.status+' '+(await res.text()).slice(0,300));
  log('✅ Criado: '+path,'ok');
}
async function criarTudo(){
  try{
    var t=getToken(); el('log').innerHTML=''; log('🚀 Começando criação em kai-app/...','warn');
    var check=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO,{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});
    if(!check.ok) throw new Error('Acesso nao ativado. Clique primeiro em ATIVAR. Erro: '+check.status);
    log('✅ Acesso confirmado, criando arquivos...','ok');
    var indexHtml=[
'<!DOCTYPE html>',
'<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-AI App</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0714"><link rel="stylesheet" href="style.css"></head>',
'<body>',
'<header><div class="logo">K-<span>AI</span> App</div><div><button id="btnInstall" style="display:none">Instalar</button><button class="btn-pub" onclick="publicarTudo()">Publicar</button></div></header>',
'<p class="sub">Mesmo K-AI do KORVIL - Pollinations + Gemini + GROQ</p><div id="status">Pronto</div>',
'<button class="btn-new" onclick="criarNovoProjeto()">+ Criar Novo Projeto</button>',
'<h3>Meus Projetos</h3><div id="lista"></div>',
'<div id="chat"><div class="chat-top"><b id="chatTitulo">Novo Projeto</b><button onclick="fecharChat()">Fechar</button></div><div id="msgs"></div><div class="inputRow"><input id="prompt" placeholder="Ex: cria um app de vendas..."><button onclick="enviarParaKAI()">Enviar</button></div><button class="btn-pub" style="width:100%;margin-top:10px" onclick="publicarTudo()">Publicar Projeto</button></div>',
'<script src="config.js"></scr'+'ipt><script src="k-ai.js"></scr'+'ipt><script src="app.js"></scr'+'ipt>',
'</body></html>'
    ].join('\n');
    var styleCss='*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#0b0714;color:#fff;padding:16px;padding-bottom:90px}header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900}.logo span{color:#a855f7}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.btn-pub{background:#22c55e;color:#000}.btn-new{background:#a855f7;color:#fff;width:100%;margin:16px 0;font-size:16px;padding:16px}.card{background:#1a1030;border:1px solid #2e1a5e;border-radius:16px;padding:16px;margin-bottom:12px}.card p{color:#b7a8d9;font-size:13px}.card .row{display:flex;gap:8px;margin-top:12px}.open{background:#a855f7;color:#fff;flex:1}.pub{background:#22c55e;flex:1}#chat{position:fixed;inset:0;background:#0b0714;display:none;flex-direction:column;padding:16px}#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:14px 0}.msg{background:#1a1030;padding:12px;border-radius:12px;max-width:90%;white-space:pre-wrap}.msg.me{background:#a855f7;align-self:flex-end}.inputRow{display:flex;gap:8px}.inputRow input{flex:1;padding:14px;border-radius:12px;border:1px solid #333;background:#1a1030;color:#fff}.inputRow button{background:#a855f7;color:#fff}.sub{color:#b7a8d9;margin-top:6px}#status{font-size:12px;color:#22c55e;margin-top:8px}';
    var configJs=[
'// K-AI App - Config - BACKEND ONLY',
'// Secrets no backend: GEMINI_API_KEY, GROQ_API_KEY, GH_TOKEN, REPO_TOKEN',
"window.REPO_OWNER='sistemak';",
"window.REPO_NAME='korvil-app2';",
"window.KAI_BACKEND_GERAR='/api/k-ai';",
"window.KAI_BACKEND_PUBLICAR='/api/publish';"
    ].join('\n');
    var kAiJs=[
'// K-AI - Backend: Gemini + GROQ + Pollinations. Front sem chave. POST /api/k-ai',
'window.KAI = {',
"  imagemPollinations: function(prompt){ return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt+' app moderno roxo escuro')+'?width=1024&height=512&seed='+Math.floor(Math.random()*99999)+'&nologo=true'; },",
'  extrairCodigo: function(texto, nomeProjeto){',
"    var pegar=function(lang){ var m=texto.match(new RegExp('```'+lang+'\\\\s*([\\\\s\\\\S]*?)```','i')); return m?m[1].trim():null; };",
"    var html=pegar('html'), css=pegar('css'), js=pegar('js');",
"    if(!html){ html='<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>'+nomeProjeto+'</title><link rel=\"stylesheet\" href=\"style.css\"></head><body><h1>'+nomeProjeto+'</h1><p>'+String(texto||'').slice(0,1200)+'</p><img src=\"'+this.imagemPollinations(nomeProjeto)+'\" style=\"width:100%;border-radius:12px\"><script src=\"app.js\"></scr'+'ipt></body></html>'; }",
"    if(!css) css='body{background:#0b0714;color:#fff;font-family:Arial;padding:20px} h1{color:#a855f7}';",
"    if(!js) js='console.log(\"Projeto '+nomeProjeto+' criado pelo K-AI\");';",
"    return [{path:'index.html',content:html},{path:'style.css',content:css},{path:'app.js',content:js}];",
'  },',
'  templateLocal: function(prompt, nomeProjeto){',
"    var html='<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><title>'+nomeProjeto+'</title><link rel=\"stylesheet\" href=\"style.css\"></head><body><h1>'+nomeProjeto+'</h1><p>'+prompt+'</p><img src=\"'+this.imagemPollinations(prompt)+'\" style=\"width:100%;border-radius:12px\"><button>Comecar</button><script src=\"app.js\"></scr'+'ipt></body></html>';",
"    return [{path:'index.html',content:html},{path:'style.css',content:'body{background:#0b0714;color:#fff;font-family:Arial;padding:20px}'},{path:'app.js',content:'console.log(\"K-AI template local\");'}];",
'  },',
'  gerar: async function(prompt, nomeProjeto){',
'    try{',
"      var r=await fetch(window.KAI_BACKEND_GERAR||'/api/k-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt, nomeProjeto:nomeProjeto})});",
"      if(r.ok){ var j=await r.json(); if(j && j.texto) return this.extrairCodigo(j.texto, nomeProjeto); if(j && j.arquivos) return j.arquivos; }",
"      throw new Error('backend '+r.status);",
'    }catch(e){ return this.templateLocal(prompt, nomeProjeto); }',
'  }',
'};'
    ].join('\n');
    var appJs=[
"var OWNER='sistemak', REPO='korvil-app2', BASE='kai-app/projetos/';",
"var projetos=JSON.parse(localStorage.getItem('kai_projetos')||'[]');",
'var projetoAtual=null; var deferredPrompt=null;',
"window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('btnInstall').style.display='block';});",
"document.getElementById('btnInstall').onclick=async function(){ if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;} else alert('No celular: menu > Adicionar a tela inicial'); };",
"async function garantirToken(){ var t=localStorage.getItem('REPO_TOKEN')||''; if(!t){ t=prompt('Cole REPO_TOKEN (1 vez, so se backend offline):'); if(t) localStorage.setItem('REPO_TOKEN',t.trim()); } return localStorage.getItem('REPO_TOKEN')||''; }",
"function render(){ var el=document.getElementById('lista'); if(!projetos.length){el.innerHTML='<p style=\"color:#888\">Nenhum projeto. Clique em + Criar Novo Projeto</p>';return;} el.innerHTML=projetos.map(function(p,i){return '<div class=\"card\"><h3>'+p.nome+'</h3><p>'+p.desc+' - '+p.arquivos.length+' arquivos</p><div class=\"row\"><button class=\"open\" onclick=\"abrirProjeto('+i+')\">Abrir</button><button class=\"pub\" onclick=\"publicarProjeto('+i+')\">Publicar</button></div></div>';}).join(''); }",
'render();',
"function criarNovoProjeto(){ var nome=prompt('Nome do projeto? Ex: app-de-vendas'); if(!nome) return; projetoAtual={nome:nome.toLowerCase().replace(/[^a-z0-9-]/g,'-'),desc:'Criado pelo K-AI App',arquivos:[]}; document.getElementById('chatTitulo').innerText='Criando: '+projetoAtual.nome; document.getElementById('chat').style.display='flex'; addMsg('Ola! Sou o K-AI do KORVIL. O que voce quer que eu crie em '+projetoAtual.nome+'?'); }",
"function fecharChat(){ document.getElementById('chat').style.display='none'; }",
"function abrirProjeto(i){ projetoAtual=projetos[i]; document.getElementById('chatTitulo').innerText='Projeto: '+projetoAtual.nome; document.getElementById('chat').style.display='flex'; addMsg('Projeto '+projetoAtual.nome+' aberto. O que quer mudar?'); }",
"function addMsg(t,me){ var d=document.createElement('div'); d.className='msg'+(me?' me':''); d.innerText=t; document.getElementById('msgs').appendChild(d); }",
"async function enviarParaKAI(){ var input=document.getElementById('prompt'); var texto=input.value.trim(); if(!texto) return; addMsg(texto,true); input.value=''; addMsg('K-AI pensando com Gemini + GROQ + Pollinations...'); var arquivos=await window.KAI.gerar(texto, projetoAtual.nome); projetoAtual.arquivos=arquivos; projetoAtual.desc=texto; var idx=projetos.findIndex(function(p){return p.nome===projetoAtual.nome;}); if(idx>=0) projetos[idx]=projetoAtual; else projetos.push(projetoAtual); localStorage.setItem('kai_projetos',JSON.stringify(projetos)); render(); addMsg('Pronto! Criei em kai-app/projetos/'+projetoAtual.nome); }",
"async function githubCommitDireto(path, content, message){ var token=await garantirToken(); if(!token) throw new Error('Sem REPO_TOKEN'); var sha=null; var get=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}}); if(get.ok){ var j=await get.json(); sha=j.sha; } var res=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:message,content:btoa(unescape(encodeURIComponent(content))),sha:sha||undefined,branch:'main'})}); if(!res.ok) throw new Error('GitHub '+res.status); }",
"async function githubCommit(path, content, message){ try{ var r=await fetch(window.KAI_BACKEND_PUBLICAR||'/api/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:path, content:content, message:message})}); if(r.ok) return; throw new Error('backend '+r.status); }catch(e){ return githubCommitDireto(path, content, message); } }",
"async function publicarProjeto(i){ var p=projetos[i]; document.getElementById('status').innerText='Publicando '+p.nome+'...'; try{ for(var k=0;k<p.arquivos.length;k++){ await githubCommit(BASE+p.nome+'/'+p.arquivos[k].path, p.arquivos[k].content, 'K-AI App: publicar '+p.nome+' - '+p.arquivos[k].path); } document.getElementById('status').innerText='Publicado! kai-app/projetos/'+p.nome+'/'; alert('Publicado! https://github.com/'+OWNER+'/'+REPO+'/tree/main/kai-app/projetos/'+p.nome); }catch(e){ alert('Erro: '+e.message); } }",
"async function publicarTudo(){ if(!projetos.length){alert('Crie um projeto primeiro');return;} for(var i=0;i<projetos.length;i++) await publicarProjeto(i); }"
    ].join('\n');
    var manifestJson=JSON.stringify({name:'K-AI App',short_name:'K-AI',start_url:'index.html',display:'standalone',background_color:'#0b0714',theme_color:'#0b0714',icons:[{src:'icon.png',sizes:'512x512',type:'image/png'}]},null,2);
    var readme='# K-AI App\n\nMesmo K-AI do KORVIL - Pollinations + Gemini + GROQ\n\nBackend: POST /api/k-ai (GROQ + Gemini) e POST /api/publish (GH_TOKEN / REPO_TOKEN)\nSecrets: GEMINI_API_KEY / GROQ_API_KEY / GH_TOKEN / REPO_TOKEN\n';
    var apiKai=[
'// Backend K-AI - Secrets: GEMINI_API_KEY, GROQ_API_KEY',
'export default async function handler(req, res){',
"  if(req.method!=='POST') return res.status(405).json({error:'POST only'});",
'  try{',
"    var prompt=req.body.prompt, nomeProjeto=req.body.nomeProjeto;",
"    if(!prompt) return res.status(400).json({error:'sem prompt'});",
"    var sistema='Voce e o K-AI, gerador de apps. Responda com 3 blocos: html, css, js. HTML completo, bonito, responsivo, tema escuro roxo #0b0714 / #a855f7.';",
"    var usuario='Crie um app chamado: '+(nomeProjeto||'meu-app')+' Pedido: '+prompt;",
'    var texto="";',
"    if(process.env.GROQ_API_KEY){ try{ var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+process.env.GROQ_API_KEY},body:JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'system',content:sistema},{role:'user',content:usuario}],temperature:0.7,max_tokens:6000})}); if(r.ok){ var j=await r.json(); texto=j.choices[0].message.content||''; } }catch(e){} }",
"    if(!texto && process.env.GEMINI_API_KEY){ var r2=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+process.env.GEMINI_API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:sistema+' '+usuario}]}]})}); if(!r2.ok) throw new Error('Gemini '+r2.status); var j2=await r2.json(); texto=j2.candidates[0].content.parts.map(function(p){return p.text;}).join('')||''; }",
"    if(!texto) return res.status(500).json({error:'Nenhuma IA respondeu. Confira GEMINI_API_KEY / GROQ_API_KEY.'});",
"    return res.status(200).json({texto:texto});",
"  }catch(e){ return res.status(500).json({error:e.message}); }",
'}'
    ].join('\n');
    var apiPublish=[
'// Backend Publish - Secrets: GH_TOKEN / REPO_TOKEN',
'export default async function handler(req, res){',
"  if(req.method!=='POST') return res.status(405).json({error:'POST only'});",
'  try{',
"    var token=process.env.GH_TOKEN||process.env.REPO_TOKEN;",
"    if(!token) return res.status(500).json({error:'Sem GH_TOKEN / REPO_TOKEN no backend'});",
"    var path=req.body.path, content=req.body.content, message=req.body.message;",
"    var base='https://api.github.com/repos/sistemak/korvil-app2/contents/'+path.split('/').map(encodeURIComponent).join('/');",
"    var sha=null; var get=await fetch(base,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}}); if(get.ok){ var j=await get.json(); sha=j.sha; }",
"    var put=await fetch(base,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:message||('K-AI: '+path),content:Buffer.from(content,'utf-8').toString('base64'),sha:sha||undefined,branch:'main'})});",
"    if(!put.ok) return res.status(put.status).json({error:await put.text()});",
"    return res.status(200).json({ok:true});",
"  }catch(e){ return res.status(500).json({error:e.message}); }",
'}'
    ].join('\n');
    var vercelJson=JSON.stringify({rewrites:[{source:'/api/:path*',destination:'/api/:path*'}]},null,2);
    var netlifyToml='[build]\n  publish = "kai-app"\n  functions = "api"\n\n[[redirects]]\n  from = "/api/*"\n  to = "/.netlify/functions/:splat"\n  status = 200\n';
    var secretsMd='# Secrets - BACKEND\n- GEMINI_API_KEY\n- GROQ_API_KEY\n- GH_TOKEN\n- REPO_TOKEN\nCadastre na Vercel / Netlify / GitHub Actions. Nunca no front.\n';
    await enviarArquivo('kai-app/index.html', indexHtml);
    await enviarArquivo('kai-app/style.css', styleCss);
    await enviarArquivo('kai-app/config.js', configJs);
    await enviarArquivo('kai-app/k-ai.js', kAiJs);
    await enviarArquivo('kai-app/app.js', appJs);
    await enviarArquivo('kai-app/manifest.json', manifestJson);
    await enviarArquivo('kai-app/README.md', readme);
    await enviarArquivo('kai-app/SECRETS.md', secretsMd);
    await enviarArquivo('kai-app/api/k-ai.js', apiKai);
    await enviarArquivo('kai-app/api/publish.js', apiPublish);
    await enviarArquivo('kai-app/vercel.json', vercelJson);
    await enviarArquivo('kai-app/netlify.toml', netlifyToml);
    await enviarArquivo('kai-app/projetos/.gitkeep', 'Pasta mae dos projetos criados pelo K-AI App');
    log('🎉 TUDO CRIADO COM SUCESSO!','ok');
